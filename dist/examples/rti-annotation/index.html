<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLIME - RTI Viewer</title>
    <link rel="stylesheet" href="../../css/skin.css" />
    <link rel="stylesheet" href="../examples.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <style>
        html,
        body {
            color: white;
            background-color: black;
        }

        /* Override examples.css: viewer takes full viewport, panels are fixed overlays */
        h1 {
            display: none;
        }

        .openlime {
            height: 100% !important;
        }

        /*
         * NOTE: annotation SVG is rendered inside OpenLIME shadow root,
         * so polyline shadow styles are injected from script into that root.
         */

        #annotation-toolbar {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            /* children re-enable as needed */
        }

        #marker-panel {
            pointer-events: auto;
        }

        #marker-panel .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(2px);
            border-color: rgba(255, 255, 255, 0.42);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        #marker-panel .marker-btn {
            --bs-btn-padding-y: 0.12rem;
            --bs-btn-padding-x: 0.3rem;
            --bs-btn-font-size: 0.76rem;
            --bs-btn-color: #ffffff;
            --bs-btn-border-width: 1px;
            --bs-btn-border-color: rgba(255, 255, 255, 0.75);
            --bs-btn-hover-bg: rgba(255, 255, 255, 0.12);
            --bs-btn-hover-border-color: #ffffff;
            --bs-btn-hover-color: #ffffff;
            min-width: 40px;
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #marker-panel .marker-btn.active {
            --bs-btn-bg: rgba(122, 21, 47, 0.35);
            --bs-btn-border-color: rgba(255, 255, 255, 0.75);
            --bs-btn-color: #ffe8ef;
            --bs-btn-hover-bg: rgba(122, 21, 47, 0.48);
            --bs-btn-hover-border-color: #ffffff;
            --bs-btn-active-bg: rgba(122, 21, 47, 0.62);
            --bs-btn-active-border-color: #ffffff;
        }

        #marker-panel .settings-btn {
            --bs-btn-padding-y: 0.12rem;
            --bs-btn-padding-x: 0.34rem;
            --bs-btn-font-size: 0.76rem;
            --bs-btn-color: #ffffff;
            --bs-btn-border-width: 1px;
            --bs-btn-border-color: rgba(255, 255, 255, 0.75);
            --bs-btn-hover-bg: rgba(255, 255, 255, 0.12);
            --bs-btn-hover-border-color: #ffffff;
            --bs-btn-hover-color: #ffffff;
            --bs-btn-active-bg: rgba(255, 255, 255, 0.18);
            --bs-btn-active-border-color: #ffffff;
        }

        #marker-panel .marker-icon,
        #marker-panel .action-icon {
            width: 24px;
            height: 24px;
            display: block;
        }

        #creation-hint {
            display: none;
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #creation-hint b {
            color: #ffd700;
        }

        /* Selection status panel — shown in edit mode */
        #selection-panel {
            display: none;
            pointer-events: none;
            max-width: 280px;
        }

        #selection-panel .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(2px);
            border-color: rgba(255, 255, 255, 0.42);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        /* Interaction hint — always visible except during active sessions */
        #ctrl-hint {
            display: block;
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            z-index: 9998;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #ctrl-hint b {
            color: #ffd700;
        }

        /* Toolbar locked during an active creation session */
        #annotation-toolbar.session-active #marker-panel {
            pointer-events: none;
            cursor: not-allowed;
        }

        /* Marker toolbar disabled when pencil is OFF */
        #annotation-toolbar.pencil-off #marker-panel {
            pointer-events: none;
            opacity: 0.35;
            filter: grayscale(1);
            cursor: not-allowed;
        }

        /* More compact Freehand settings dialog */
        #freehandSettingsModal {
            z-index: 20000;
        }

        #freehandSettingsModal .modal-dialog {
            max-width: 620px;
        }

        #freehandSettingsModal .modal-header,
        #freehandSettingsModal .modal-footer {
            padding: 0.45rem 0.7rem;
        }

        #freehandSettingsModal .modal-title {
            font-size: 0.95rem;
        }

        #freehandSettingsModal .modal-body {
            font-size: 0.78rem;
            padding: 0.55rem 0.7rem;
            line-height: 1.2;
        }

        #freehandSettingsModal .btn {
            font-size: 0.68rem;
            padding: 0.17rem 0.42rem;
        }

        #freehandSettingsModal .form-check {
            margin-bottom: 0.45rem !important;
        }

        #freehandSettingsModal .form-check-label {
            font-size: 0.75rem;
        }

        #freehandSettingsModal .form-label {
            margin-bottom: 0.12rem;
            font-size: 0.72rem;
        }

        #freehandSettingsModal .form-range {
            margin-bottom: 0.18rem;
            height: 1rem;
        }
    </style>

</head>

<body>
    <h1>OpenLIME - RTI Viewer</h1>
    <div id="annotation-toolbar">
        <div id="marker-panel">
            <div class="card">
                <div class="card-body py-1 px-2 d-flex flex-column gap-1">
                    <div class="d-flex align-items-center flex-wrap gap-1">
                        <span class="badge text-light">Marker</span>
                        <button id="btn-disk" class="btn btn-outline-secondary marker-btn" title="Disk" aria-label="Disk">
                            <img class="marker-icon" src="./icons/disk.svg" alt="Disk" />
                        </button>
                        <button id="btn-polyline" class="btn btn-outline-secondary marker-btn" title="Polyline" aria-label="Polyline">
                            <img class="marker-icon" src="./icons/polyline.svg" alt="Polyline" />
                        </button>
                        <button id="btn-polygon" class="btn btn-outline-secondary marker-btn" title="Polygon" aria-label="Polygon">
                            <img class="marker-icon" src="./icons/polygon.svg" alt="Polygon" />
                        </button>
                        <button id="btn-rect" class="btn btn-outline-secondary marker-btn" title="Rect" aria-label="Rect">
                            <img class="marker-icon" src="./icons/rect.svg" alt="Rect" />
                        </button>
                        <button id="btn-freehand" class="btn btn-outline-secondary marker-btn" title="Freehand" aria-label="Freehand">
                            <img class="marker-icon" src="./icons/freehand.svg" alt="Freehand" />
                        </button>
                    </div>
                    <div class="d-flex align-items-center flex-wrap gap-1">
                        <button id="btn-edit" class="btn btn-outline-light settings-btn" title="Edit" aria-label="Edit">
                            <img class="action-icon" src="./icons/edit.svg" alt="Edit" />
                        </button>
                        <button id="btn-relax-selected" class="btn btn-outline-light settings-btn" title="Relax" aria-label="Relax">
                            <img class="action-icon" src="./icons/relax.svg" alt="Relax" />
                        </button>
                        <button id="btn-freehand-settings" class="btn btn-outline-light settings-btn" title="Settings" aria-label="Settings">
                            <img class="action-icon" src="./icons/settings.svg" alt="Settings" />
                        </button>
                        <button id="btn-anno-save" class="btn btn-outline-light settings-btn" title="Save" aria-label="Save">
                            <img class="action-icon" src="./icons/save.svg" alt="Save" />
                        </button>
                        <button id="btn-anno-load" class="btn btn-outline-light settings-btn" title="Load" aria-label="Load">
                            <img class="action-icon" src="./icons/load.svg" alt="Load" />
                        </button>
                        <button id="btn-anno-group" class="btn btn-outline-light settings-btn" title="Group" aria-label="Group">
                            <img class="action-icon" src="./icons/group.svg" alt="Group" />
                        </button>
                        <button id="btn-anno-ungroup" class="btn btn-outline-light settings-btn" title="Ungroup" aria-label="Ungroup">
                            <img class="action-icon" src="./icons/ungroup.svg" alt="Ungroup" />
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="creation-hint"></div>
    <div id="ctrl-hint">
        Select a marker button to draw &nbsp;·&nbsp; Click to select &nbsp;·&nbsp; <b>Ctrl+click</b> (or
        <b>&#8984;+click</b>) to multi-select
    </div>

    <div class="modal fade" id="freehandSettingsModal" tabindex="-1" aria-labelledby="freehandSettingsLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="freehandSettingsLabel">Freehand Settings</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex gap-2 mb-3">
                        <button type="button" id="fh-preset-natural"
                            class="btn btn-outline-light btn-sm">Natural</button>
                        <button type="button" id="fh-preset-strong"
                            class="btn btn-outline-warning btn-sm">Strong</button>
                        <button type="button" id="fh-preset-smooth-snap" class="btn btn-outline-primary btn-sm">Smooth
                            Snap</button>
                        <button type="button" id="fh-preset-smooth-snap-strong"
                            class="btn btn-outline-danger btn-sm">Smooth Snap Strong</button>
                    </div>

                    <div class="d-flex gap-2 mb-3">
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="fh-enable-filter">
                        <label class="form-check-label" for="fh-enable-filter">Enable Smoothing Filter</label>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="fh-closed">
                        <label class="form-check-label" for="fh-closed">Close stroke (create polygon)</label>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="fh-auto-close-near-start">
                        <label class="form-check-label" for="fh-auto-close-near-start">Auto-close when release is near
                            first point</label>
                    </div>

                    <label for="fh-stroke-width" class="form-label d-flex justify-content-between mt-2">
                        <span>Stroke width (px)</span>
                        <span id="fh-stroke-width-value">2.0</span>
                    </label>
                    <input id="fh-stroke-width" type="range" class="form-range" min="1" max="12" step="0.1" value="2.0">

                    <hr class="border-secondary opacity-50 my-2">

                    <label for="fh-sample-distance" class="form-label d-flex justify-content-between">
                        <span>Sample distance (px)</span>
                        <span id="fh-sample-distance-value">1.5</span>
                    </label>
                    <input id="fh-sample-distance" type="range" class="form-range" min="0.5" max="6" step="0.1"
                        value="1.5">

                    <label for="fh-simplify" class="form-label d-flex justify-content-between mt-3">
                        <span>Simplify tolerance (px)</span>
                        <span id="fh-simplify-value">1.0</span>
                    </label>
                    <input id="fh-simplify" type="range" class="form-range" min="0.2" max="5" step="0.1" value="1.0">

                    <label for="fh-smooth-angle" class="form-label d-flex justify-content-between mt-3">
                        <span>Smooth angle (deg)</span>
                        <span id="fh-smooth-angle-value">90</span>
                    </label>
                    <input id="fh-smooth-angle" type="range" class="form-range" min="20" max="175" step="1" value="90">

                    <label for="fh-hit-tolerance" class="form-label d-flex justify-content-between mt-3">
                        <span>Hit tolerance (px)</span>
                        <span id="fh-hit-tolerance-value">10</span>
                    </label>
                    <input id="fh-hit-tolerance" type="range" class="form-range" min="4" max="24" step="1" value="10">

                    <hr class="border-secondary opacity-50 my-2">

                    <div class="form-check form-switch mt-3 mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="fh-enable-contour-snap"
                            checked>
                        <label class="form-check-label" for="fh-enable-contour-snap">Enable Contour Snap (from rendered
                            frame)</label>
                    </div>

                    <label for="fh-snap-radius" class="form-label d-flex justify-content-between mt-2">
                        <span>Contour snap radius (px)</span>
                        <span id="fh-snap-radius-value">14</span>
                    </label>
                    <input id="fh-snap-radius" type="range" class="form-range" min="4" max="40" step="1" value="14">

                    <label for="fh-snap-strength" class="form-label d-flex justify-content-between mt-3">
                        <span>Contour snap strength</span>
                        <span id="fh-snap-strength-value">0.70</span>
                    </label>
                    <input id="fh-snap-strength" type="range" class="form-range" min="0" max="1" step="0.05"
                        value="0.70">

                    <label for="fh-contour-min-gradient" class="form-label d-flex justify-content-between mt-3">
                        <span>Contour min gradient</span>
                        <span id="fh-contour-min-gradient-value">22</span>
                    </label>
                    <input id="fh-contour-min-gradient" type="range" class="form-range" min="5" max="80" step="1"
                        value="22">

                    <label for="fh-contour-amount" class="form-label d-flex justify-content-between mt-3">
                        <span>Contour amount</span>
                        <span id="fh-contour-amount-value">0.55</span>
                    </label>
                    <input id="fh-contour-amount" type="range" class="form-range" min="0.10" max="1.00" step="0.05"
                        value="0.55">

                    <hr class="border-secondary opacity-50 my-2">

                    <div class="form-check form-switch mt-3 mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="fh-enable-final-relax">
                        <label class="form-check-label" for="fh-enable-final-relax">Enable final relax</label>
                    </div>

                    <label for="fh-final-relax-strength" class="form-label d-flex justify-content-between mt-2">
                        <span>Final relax strength</span>
                        <span id="fh-final-relax-strength-value">0.12</span>
                    </label>
                    <input id="fh-final-relax-strength" type="range" class="form-range" min="0.00" max="0.50"
                        step="0.01" value="0.12">

                    <label for="fh-final-relax-dense-factor" class="form-label d-flex justify-content-between mt-3">
                        <span>Final relax dense factor</span>
                        <span id="fh-final-relax-dense-factor-value">1.45</span>
                    </label>
                    <input id="fh-final-relax-dense-factor" type="range" class="form-range" min="0.50" max="3.00"
                        step="0.05" value="1.45">

                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div class="openlime"></div>
    <input id="anno-load-input" type="file" accept="application/json,.json" style="display:none" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="../../js/openlime.js"></script>
    <script>
        // Create an OpenLIME canvas into openlime
        const lime = new OpenLIME.Viewer('.openlime');

        // Create 4 RTI layers and add them to the canvans
        // A RTI layer has many channels. In this example the 4 layers store 
        // channels in 4 different ways: image, deepzoom, tarzoom and itarzoom 

        const layer1 = new OpenLIME.Layer({
            label: 'coin-deepzoom hsh',
            layout: 'deepzoom',
            type: 'rti',
            url: '../../assets/rti/hsh/info.json',
            transform: { x: 0, y: 0, z: 1, a: 0 },
            normals: false
        });
        lime.addLayer('coin', layer1);

        // Fetch a skin (visual elements for the web page)
        OpenLIME.Skin.setUrl('../../skin/skin.svg');

        let idCounter = 0;
        // ── Annotation Manager ───────────────────────────────────────────────
        // Create the manager AFTER layers are registered so it can share their
        // layout when auto-creating the SVG annotation layer.
        const manager = new OpenLIME.ManagerSvgAnnotation(lime, {
            // Conservation/restoration semantic classes — assign to any annotation
            // regardless of which marker tool was used to draw it.
            semanticClasses: {
                // default:         { label: 'Default',         fill: 'rgba(34,187,85,0.15)',  stroke: '#22bb55', strokeWidth: 2 },
                surface:         { label: 'Surface',         fill: 'rgba(34,187,85,0.15)',  stroke: '#22bb55', strokeWidth: 2 },
                crack:           { label: 'Crack',           fill: 'none',                   stroke: '#e63946', strokeWidth: 1.5 },
                loss:            { label: 'Loss',            fill: 'rgba(230,57,70,0.20)',   stroke: '#e63946', strokeWidth: 2 },
                corrosion:       { label: 'Corrosion',       fill: 'rgba(255,140,0,0.20)',   stroke: '#ff8c00', strokeWidth: 2 },
                stain:           { label: 'Stain',           fill: 'rgba(100,160,255,0.20)', stroke: '#64a0ff', strokeWidth: 2 },
                previous_repair: { label: 'Previous Repair', fill: 'rgba(200,100,255,0.15)', stroke: '#c864ff', strokeWidth: 2 },
                inscription:     { label: 'Inscription',     fill: 'none',                   stroke: '#ffd700', strokeWidth: 1.5 },
            },
            structuralClasses: {
                default: {},
                selected: { stroke: '#aaaa00', fill: 'rgba(255,225,100,0.20)' },
                // Built-in preloaded filters in ManagerSvgAnnotation:
                // olime-glow-soft, olime-shadow-soft, olime-outline-soft
                underEditing: { strokeWidth: 3, fillOpacity: 0.8, filter: 'url(#olime-glow-soft)' },
            },
            // With singleEditMode, vertex handles are shown only when exactly
            // one annotation is selected; activeAnnotation returns null otherwise.
            singleEditMode: true,
            // Capture viewer state (light direction, render mode, …) in each annotation
            enableState: true,
            // Demo: custom label style from API (dark red background with 0.3 opacity)
            labelStyle: {
                backgroundFill: 'rgba(80, 0, 0, 0.30)',
            },

            // Called whenever a new annotation is created
            onCreate: (anno) => {
                anno.label = `Anno ${++idCounter}`;
                console.log(anno);
                document.getElementById('creation-hint').style.display = 'none';
                document.getElementById('annotation-toolbar').classList.remove('session-active');
                console.log('[ManagerSvgAnnotation] CREATE', anno);
            },

            // Show creation hint during sequence/drag session
            onSessionStart: (anno) => {
                document.getElementById('annotation-toolbar').classList.add('session-active');
                const type = anno?.data?._markerType;
                document.getElementById('ctrl-hint').style.display = 'none';
                if (type === 'polyline') {
                    document.getElementById('creation-hint').innerText =
                        'Click to add vertex · double-click last point to finish · Enter to finish · Esc to cancel';
                    document.getElementById('creation-hint').style.display = 'block';
                } else if (type === 'rect') {
                    document.getElementById('creation-hint').innerText =
                        'Move mouse to size the rectangle · double-click (or Enter) to finish · Esc to cancel';
                    document.getElementById('creation-hint').style.display = 'block';
                } else if (type === 'freehand') {
                    document.getElementById('creation-hint').innerText =
                        'Press and drag to draw · release to finish · Esc to cancel';
                    document.getElementById('creation-hint').style.display = 'block';
                }
            },
            onSessionCancel: () => {
                document.getElementById('annotation-toolbar').classList.remove('session-active');
                document.getElementById('creation-hint').style.display = 'none';
            },

            // Called when the user selects an annotation by clicking on it.
            // Fired with the last activated annotation only; use onSelectionChange
            // to react to the complete selection set.
            onSelect: (anno) => {
                console.log('[ManagerSvgAnnotation] SELECT', anno.id, anno.label);
            },

            // Called whenever the multi-selection set changes:
            //   plain click, Ctrl+click, setSelectedIds(), deselectAll(), …
            // `annotations` is the full Annotation[] currently selected.
            onSelectionChange: (annotations) => {
                const info = document.getElementById('selection-info');
                if (info) {
                    info.textContent = annotations.length === 0
                        ? 'none'
                        : annotations.map(a => a.label || a.id.slice(0, 8)).join(', ');
                }
                console.log(
                    '[ManagerSvgAnnotation] SELECTION_CHANGE',
                    annotations.map(a => ({ id: a.id, label: a.label }))
                );
            },
        });

        const semanticHotkeys = {
            '1': 'surface',
            '2': 'crack',
            '3': 'loss',
            '4': 'corrosion',
            '5': 'stain',
            '6': 'previous_repair',
            '7': 'inscription',
        };

        // Demo shortcuts for semantic/structural class APIs:
        // - [1..7] assign semantic class to selected annotations
        // - [0] clear semantic class (falls back to manager default)
        // - [u] toggle underEditing structural class on selection
        // - [h] / [Shift+h] set/clear a custom structural class on selection
        manager.setStructuralClass('hovered', { strokeWidth: 3 });
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'l') {
                manager.toggleLabelsVisible();
                e.preventDefault();
                return;
            }

            if (!manager.active || manager.mode !== 'edit') return;
            const selectedIds = [...(manager.layer?.selected ?? [])];
            if (!selectedIds.length) return;

            const semanticId = semanticHotkeys[e.key];
            if (semanticId) {
                selectedIds.forEach((id) => manager.setAnnotationSemanticClass(id, semanticId));
                e.preventDefault();
                return;
            }

            if (e.key === '0') {
                selectedIds.forEach((id) => manager.setAnnotationSemanticClass(id, null));
                e.preventDefault();
                return;
            }

            if (e.key.toLowerCase() === 'u') {
                const allUnderEditing = selectedIds.every((id) => {
                    const anno = manager.getAnnotationById(id);
                    return anno?.structuralClass === 'underEditing';
                });
                const targetStructural = allUnderEditing ? null : 'underEditing';
                // Use the current selection as the input set, then deselect to
                // make the underEditing glow visible without selected styling.
                manager.deselectAll();
                selectedIds.forEach((id) => manager.setAnnotationStructuralClass(id, targetStructural));
                e.preventDefault();
                return;
            }

            if (e.key.toLowerCase() === 'h') {
                const structuralId = e.shiftKey ? null : 'hovered';
                selectedIds.forEach((id) => manager.setAnnotationStructuralClass(id, structuralId));
                e.preventDefault();
            }
        });

        // ── UI ───────────────────────────────────────────────────────────────
        // Pass the manager so the pencil action activates/deactivates it
        const ui = new OpenLIME.UIBasic(lime, {
            showLightDirections: true,
            annotationManager: manager,
        });

        const EDIT_HINT_TEXT =
            'Click to select \u00b7 <b>Ctrl+click</b> (or <b>&#8984;+click</b>) for multi-select';
        const MARKER_HINTS = {
            disk: '<b>Disk</b>: double-click on canvas to create',
            polyline: '<b>Polyline</b>: single-click to start/add points \u00b7 double-click to finish',
            polygon: '<b>Polygon</b>: single-click to start/add points \u00b7 double-click to finish',
            rect: '<b>Rect</b>: single-click to start \u00b7 move mouse to size \u00b7 double-click to finish',
            freehand: '<b>Freehand</b>: press and drag to draw \u00b7 release to finish',
        };

        function setCtrlHint(html) {
            const el = document.getElementById('ctrl-hint');
            el.innerHTML = html;
            el.style.display = 'block';
        }

        function hideCtrlHint() {
            document.getElementById('ctrl-hint').style.display = 'none';
        }

        function syncMarkerToolbarEnabled() {
            const toolbar = document.getElementById('annotation-toolbar');
            toolbar.classList.toggle('pencil-off', !manager.active);
        }

        // When pencil mode is activated, deselect all annotations
        ui.addEvent('pencilEnabled', () => {
            manager.deselectAll(); // colours restored automatically from semantic/structural styles
            syncMarkerToolbarEnabled();
            if (selectedMarkerKey && markerConfigs[selectedMarkerKey]) {
                // Re-apply the selected marker so manager mode/options match UI state.
                setMarker(selectedMarkerKey);
            } else {
                setCtrlHint(EDIT_HINT_TEXT);
            }
        });
        ui.addEvent('pencilDisabled', () => {
            syncMarkerToolbarEnabled();
            hideCtrlHint();
        });

        // ── Marker selector panel ────────────────────────────────────────
        const freehandSettings = {
            enableSmoothingFilter: false,
            // Backward-compatible alias used by older builds.
            enableTremorFilter: false,
            sampleDistance: 1.5,
            simplifyTolerance: 1.0,
            smoothAngle: 90,
            closed: false,
            autoCloseNearStart: true,
            hitTolerance: 10,
            enableContourSnap: true,
            contourSnapRadius: 14,
            contourSnapStrength: 0.70,
            contourMinGradient: 22,
            contourAmount: 0.55,
            enableFinalRelax: true,
            finalRelaxStrength: 0.12,
            finalRelaxDenseFactor: 1.45,
            strokeWidth: 5.0,
        };


        const freehandModalEl = document.getElementById('freehandSettingsModal');
        const freehandModal = (window.bootstrap && freehandModalEl)
            ? new bootstrap.Modal(freehandModalEl)
            : null;

        function updateFreehandLabels() {
            document.getElementById('fh-sample-distance-value').textContent = Number(freehandSettings.sampleDistance).toFixed(1);
            document.getElementById('fh-simplify-value').textContent = Number(freehandSettings.simplifyTolerance).toFixed(1);
            document.getElementById('fh-smooth-angle-value').textContent = String(Math.round(freehandSettings.smoothAngle));
            document.getElementById('fh-hit-tolerance-value').textContent = String(Math.round(freehandSettings.hitTolerance));
            document.getElementById('fh-snap-radius-value').textContent = String(Math.round(freehandSettings.contourSnapRadius));
            document.getElementById('fh-snap-strength-value').textContent = Number(freehandSettings.contourSnapStrength).toFixed(2);
            document.getElementById('fh-contour-min-gradient-value').textContent = String(Math.round(freehandSettings.contourMinGradient));
            document.getElementById('fh-contour-amount-value').textContent = Number(freehandSettings.contourAmount).toFixed(2);
            document.getElementById('fh-final-relax-strength-value').textContent = Number(freehandSettings.finalRelaxStrength).toFixed(2);
            document.getElementById('fh-final-relax-dense-factor-value').textContent = Number(freehandSettings.finalRelaxDenseFactor).toFixed(2);
            document.getElementById('fh-stroke-width-value').textContent = Number(freehandSettings.strokeWidth).toFixed(1);
        }

        function getEffectiveContourMinGradient() {
            const base = Math.max(0, Number(freehandSettings.contourMinGradient) || 0);
            const amount = Math.max(0.10, Math.min(1.00, Number(freehandSettings.contourAmount) || 1));
            // Lower amount means fewer contours by increasing the effective threshold.
            return Math.min(255, Math.round(base + (1 - amount) * 70));
        }

        function pointsToAttr(points) {
            return points.map(p => `${p.x},${p.y}`).join(' ');
        }

        function refreshAnnotationPoints(anno) {
            const pts = anno?.data?._markerPoints;
            if (!Array.isArray(pts) || pts.length < 2) return;
            const attr = pointsToAttr(pts);

            const shape = anno.elements?.find(el =>
                el.classList?.contains('annotation-polyline') || el.classList?.contains('annotation-freehand'));
            if (shape) shape.setAttribute('points', attr);

            const hit = anno.elements?.find(el =>
                el.classList?.contains('annotation-polyline-hit') || el.classList?.contains('annotation-freehand-hit'));
            if (hit) hit.setAttribute('points', attr);

            const handles = anno.elements?.find(el => el.classList?.contains('annotation-vertex-handles'));
            if (handles) {
                for (let i = 0; i < Math.min(handles.children.length, pts.length); i++) {
                    handles.children[i].setAttribute('cx', String(pts[i].x));
                    handles.children[i].setAttribute('cy', String(pts[i].y));
                }
            }
        }

        function relaxSelectedAnnotations() {
            const selectedIds = [...(manager.layer?.selected ?? [])];
            if (!selectedIds.length) return;
            if (typeof OpenLIME.relaxDenseZigZagPoints !== 'function') {
                console.warn('[Relax] relaxDenseZigZagPoints not available yet. Wait for src rebuild (nodemon/rollup).');
                return;
            }

            let changed = 0;
            for (const id of selectedIds) {
                const anno = manager.getAnnotationById(id);
                if (!anno?.data) continue;

                const markerType = anno.data._markerType;
                const isSupported = markerType === 'polyline' || markerType === 'freehand';
                const pts = anno.data._markerPoints;
                if (!isSupported || !Array.isArray(pts) || pts.length < 3) continue;

                const closed = !!anno.data._markerClosed;
                const relaxed = OpenLIME.relaxDenseZigZagPoints(pts, {
                    closed,
                    strength: 0.34,
                    denseFactor: 1.8,
                    sharpCosThreshold: 0.35,
                });
                anno.data._markerPoints = relaxed;
                refreshAnnotationPoints(anno);
                anno.needsUpdate = true;
                manager.emit('update', anno);
                changed += 1;
            }

            if (changed > 0) {
                manager.viewer.redraw();
            }
        }

        function syncFreehandControlsFromState() {
            document.getElementById('fh-enable-filter').checked = !!freehandSettings.enableSmoothingFilter;
            document.getElementById('fh-closed').checked = !!freehandSettings.closed;
            document.getElementById('fh-auto-close-near-start').checked = !!freehandSettings.autoCloseNearStart;
            document.getElementById('fh-sample-distance').value = String(freehandSettings.sampleDistance);
            document.getElementById('fh-simplify').value = String(freehandSettings.simplifyTolerance);
            document.getElementById('fh-smooth-angle').value = String(freehandSettings.smoothAngle);
            document.getElementById('fh-hit-tolerance').value = String(freehandSettings.hitTolerance);
            document.getElementById('fh-enable-contour-snap').checked = !!freehandSettings.enableContourSnap;
            document.getElementById('fh-snap-radius').value = String(freehandSettings.contourSnapRadius);
            document.getElementById('fh-snap-strength').value = String(freehandSettings.contourSnapStrength);
            document.getElementById('fh-contour-min-gradient').value = String(freehandSettings.contourMinGradient);
            document.getElementById('fh-contour-amount').value = String(freehandSettings.contourAmount);
            document.getElementById('fh-enable-final-relax').checked = !!freehandSettings.enableFinalRelax;
            document.getElementById('fh-final-relax-strength').value = String(freehandSettings.finalRelaxStrength);
            document.getElementById('fh-final-relax-dense-factor').value = String(freehandSettings.finalRelaxDenseFactor);
            document.getElementById('fh-stroke-width').value = String(freehandSettings.strokeWidth);
            updateFreehandLabels();
        }

        function applyFreehandSettingsIfActive() {
            if (manager.activeMarker !== 'freehand') return;
            manager.setActiveMarker('freehand', {
                ...freehandSettings,
                contourMinGradient: getEffectiveContourMinGradient(),
            });
        }

        function applyFreehandPreset(name) {
            if (name === 'natural') {
                freehandSettings.enableSmoothingFilter = true;
                freehandSettings.enableTremorFilter = true;
                freehandSettings.sampleDistance = 1.4;
                freehandSettings.simplifyTolerance = 1.0;
                freehandSettings.smoothAngle = 95;
                freehandSettings.hitTolerance = 10;
            } else if (name === 'strong') {
                freehandSettings.enableSmoothingFilter = true;
                freehandSettings.enableTremorFilter = true;
                freehandSettings.sampleDistance = 0.8;
                freehandSettings.simplifyTolerance = 2.4;
                freehandSettings.smoothAngle = 145;
                freehandSettings.hitTolerance = 10;
                freehandSettings.enableContourSnap = true;
                freehandSettings.contourSnapRadius = 16;
                freehandSettings.contourSnapStrength = 0.75;
                freehandSettings.contourMinGradient = 20;
            } else if (name === 'smoothSnap') {
                // Dedicated anti-zigzag setup for contour snapping.
                freehandSettings.enableSmoothingFilter = true;
                freehandSettings.enableTremorFilter = true;
                freehandSettings.enableContourSnap = true;
                freehandSettings.sampleDistance = 1.6;
                freehandSettings.simplifyTolerance = 2.0;
                freehandSettings.smoothAngle = 135;
                freehandSettings.hitTolerance = 10;
                freehandSettings.contourSnapRadius = 10;
                freehandSettings.contourSnapStrength = 0.58;
                freehandSettings.contourMinGradient = 30;
                freehandSettings.finalRelaxStrength = 0.12;
                freehandSettings.finalRelaxDenseFactor = 1.45;
            } else if (name === 'smoothSnapStrong') {
                // Strong snap with extra smoothing to keep curves clean and reduce zig-zag.
                freehandSettings.enableSmoothingFilter = true;
                freehandSettings.enableTremorFilter = true;
                freehandSettings.enableContourSnap = true;
                freehandSettings.sampleDistance = 1.3;
                freehandSettings.simplifyTolerance = 2.8;
                freehandSettings.smoothAngle = 165;
                freehandSettings.hitTolerance = 10;
                freehandSettings.contourSnapRadius = 12;
                freehandSettings.contourSnapStrength = 0.70;
                freehandSettings.contourMinGradient = 17;
                freehandSettings.contourAmount = 0.55;
                freehandSettings.finalRelaxStrength = 0.12;
                freehandSettings.finalRelaxDenseFactor = 1.45;
            }
            syncFreehandControlsFromState();
            applyFreehandSettingsIfActive();
        }

        const markerConfigs = {
            'disk':     { type: 'disk',     opts: {} },
            'polyline': { type: 'polyline', opts: { closed: false } },
            'polygon':  { type: 'polyline', opts: { closed: true  } },
            'rect':     { type: 'rect',     opts: {} },
            'freehand': { type: 'freehand', opts: { ...freehandSettings } },
        };

        let selectedMarkerKey = null;

        function clearMarkerSelectionUI() {
            document.querySelectorAll('#marker-panel .marker-btn')
                .forEach(b => b.classList.remove('active'));
        }

        function activateEditModeUI() {
            clearMarkerSelectionUI();
            selectedMarkerKey = null;
            manager.setActiveMarker('disk');
            if (manager.active) manager.setMode('edit');
            setCtrlHint(EDIT_HINT_TEXT);
        }

        function setMarker(key) {
            const cfg = markerConfigs[key];
            if (key === 'freehand') {
                cfg.opts = { ...freehandSettings, contourMinGradient: getEffectiveContourMinGradient() };
            }
            manager.setActiveMarker(cfg.type, cfg.opts);
            clearMarkerSelectionUI();
            document.getElementById('btn-' + key).classList.add('active');
            selectedMarkerKey = key;
            setCtrlHint(MARKER_HINTS[key] || EDIT_HINT_TEXT);

            // Arm creation immediately for non-disk markers.
            if (key !== 'disk' && manager.active) manager.setMode('create');
        }

        function toggleMarker(key) {
            // Clicking the already active marker deselects all marker buttons.
            if (selectedMarkerKey === key) {
                activateEditModeUI();
                return;
            }
            setMarker(key);
        }

        function groupSelected() {
            const selectedIds = [...(manager.layer?.selected ?? [])];
            if (!selectedIds.length || selectedIds.length < 2) return;
            console.log('Group selected');
            manager.groupSelected();
            // Send to log annotation ids

            console.log('Annotation ids after grouping');
            for (let a of manager.layer.annotations) {
                console.log(a.id);
            }
        }

        function ungroupSelected() {
            const selectedIds = [...(manager.layer?.selected ?? [])];
            console.log('Ungroup selected ids:', selectedIds);
            if (selectedIds.length == 0) return;

            for (let id of selectedIds) {
                console.log('Ungroup selected', id);
                manager.ungroupAnnotation(id);
                // Send to log annotation ids
            }

            console.log('Annotation ids after ungrouping');
            for (let a of manager.layer.annotations) {
                console.log(a.id);
            }
        }

        document.getElementById('btn-disk').addEventListener('click', () => toggleMarker('disk'));
        document.getElementById('btn-polyline').addEventListener('click', () => toggleMarker('polyline'));
        document.getElementById('btn-polygon').addEventListener('click', () => toggleMarker('polygon'));
        document.getElementById('btn-rect').addEventListener('click', () => toggleMarker('rect'));
        document.getElementById('btn-freehand').addEventListener('click', () => toggleMarker('freehand'));
        document.getElementById('btn-edit').addEventListener('click', () => activateEditModeUI());
        document.getElementById('btn-anno-group').addEventListener('click', () => groupSelected());
        document.getElementById('btn-anno-ungroup').addEventListener('click', () => ungroupSelected());
        document.getElementById('btn-relax-selected').addEventListener('click', () => relaxSelectedAnnotations());
        document.getElementById('btn-freehand-settings').addEventListener('click', () => {
            syncFreehandControlsFromState();
            freehandModal?.show();
        });

        document.getElementById('btn-anno-save').addEventListener('click', () => {
            try {
                const payload = manager.exportAnnotations();
                const json = JSON.stringify(payload, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const now = new Date();
                const stamp = now.toISOString().replace(/[:.]/g, '-');
                a.download = `openlime-annotations-${stamp}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error('[Annotations] Save failed', err);
                alert('Failed to save annotations JSON. See console for details.');
            }
        });

        const annoLoadInput = document.getElementById('anno-load-input');
        document.getElementById('btn-anno-load').addEventListener('click', () => {
            annoLoadInput.value = '';
            annoLoadInput.click();
        });

        annoLoadInput.addEventListener('change', async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
                const text = await file.text();
                const parsed = JSON.parse(text);
                if (!Array.isArray(parsed)) {
                    throw new Error('Expected a JSON array of annotations');
                }

                // Replace current annotations with loaded ones.
                const existingIds = manager.getAnnotations().map(a => a.id);
                if (existingIds.length) manager.deleteAnnotations(existingIds);
                manager.importAnnotations(parsed);
                manager.deselectAll();
            } catch (err) {
                console.error('[Annotations] Load failed', err);
                alert('Failed to load annotations JSON. Check file format and console logs.');
            }
        });

        document.getElementById('fh-enable-filter').addEventListener('change', (e) => {
            freehandSettings.enableSmoothingFilter = !!e.target.checked;
            freehandSettings.enableTremorFilter = freehandSettings.enableSmoothingFilter;
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-preset-natural').addEventListener('click', () => applyFreehandPreset('natural'));
        document.getElementById('fh-preset-strong').addEventListener('click', () => applyFreehandPreset('strong'));
        document.getElementById('fh-preset-smooth-snap').addEventListener('click', () => applyFreehandPreset('smoothSnap'));
        document.getElementById('fh-preset-smooth-snap-strong').addEventListener('click', () => applyFreehandPreset('smoothSnapStrong'));
        document.getElementById('fh-closed').addEventListener('change', (e) => {
            freehandSettings.closed = !!e.target.checked;
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-auto-close-near-start').addEventListener('change', (e) => {
            freehandSettings.autoCloseNearStart = !!e.target.checked;
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-sample-distance').addEventListener('input', (e) => {
            freehandSettings.sampleDistance = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-simplify').addEventListener('input', (e) => {
            freehandSettings.simplifyTolerance = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-smooth-angle').addEventListener('input', (e) => {
            freehandSettings.smoothAngle = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-hit-tolerance').addEventListener('input', (e) => {
            freehandSettings.hitTolerance = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-enable-contour-snap').addEventListener('change', (e) => {
            freehandSettings.enableContourSnap = !!e.target.checked;
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-snap-radius').addEventListener('input', (e) => {
            freehandSettings.contourSnapRadius = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-snap-strength').addEventListener('input', (e) => {
            freehandSettings.contourSnapStrength = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-contour-min-gradient').addEventListener('input', (e) => {
            freehandSettings.contourMinGradient = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-contour-amount').addEventListener('input', (e) => {
            freehandSettings.contourAmount = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-enable-final-relax').addEventListener('change', (e) => {
            freehandSettings.enableFinalRelax = !!e.target.checked;
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-final-relax-strength').addEventListener('input', (e) => {
            freehandSettings.finalRelaxStrength = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-final-relax-dense-factor').addEventListener('input', (e) => {
            freehandSettings.finalRelaxDenseFactor = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });
        document.getElementById('fh-stroke-width').addEventListener('input', (e) => {
            freehandSettings.strokeWidth = Number(e.target.value);
            updateFreehandLabels();
            applyFreehandSettingsIfActive();
        });

        syncFreehandControlsFromState();
        if (manager.active) setCtrlHint(EDIT_HINT_TEXT);
        else hideCtrlHint();

        // ── Mode panel ─────────────────────────────────────────────
        // Modes are set automatically (double-click → create, click → edit);
        // just keep the selection panel in sync.
        manager.addEvent('modeChange', (mode) => {
            const selectionPanel = document.getElementById('selection-panel');
            if (selectionPanel) {
                selectionPanel.style.display = mode === 'edit' ? 'block' : 'none';
            }
            // Restore ctrl-hint when returning to edit mode (was hidden during creation session)
            if (mode === 'edit') {
                setCtrlHint(EDIT_HINT_TEXT);
            }
            if (mode !== 'edit') {
                const selectionInfo = document.getElementById('selection-info');
                if (selectionInfo) selectionInfo.textContent = 'none';
            }
        });

        // Add zoomin and zoomout to the toolbar
        ui.actions.zoomin.display = true;
        ui.actions.zoomout.display = true;
        ui.actions.light.active = true;

        // Show the pencil toggle button in the toolbar
        ui.actions.pencil.display = true;

        // Initial state: marker panel disabled until pencil is enabled.
        syncMarkerToolbarEnabled();

        OpenLIME.HSH.minElevation = 0.2;

        //ui.toggleLightController(true);

    </script>
</body>

</html>
